[package]
name = "legado-source-filter"
version = "0.1.0"
edition = "2024"
description = "Filter Legado book sources to find usable ones"

[dependencies]
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["blocking", "rustls-tls", "cookies", "gzip", "charset"], default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
scraper = "0.22"
jsonpath-rust = "0.7"
chardetng = "0.1"
encoding_rs = "0.8"
toml = "0.8"
clap = { version = "4", features = ["derive"] }
rusqlite = { version = "0.34", features = ["bundled"] }
url = "2"
regex = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
thiserror = "2"
